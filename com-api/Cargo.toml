[workspace]
resolver = "3"
members = [
    "com-api",
    "com-api-concept",
    "com-api-runtime-mock",
    "com-api-runtime-lola",

    "examples",
    "examples/com-api-gen"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = ["common"]
license = "Apache-2.0"

[workspace.dependencies]
com-api = { path = "com-api"}
com-api-concept = { path = "com-api-concept"}
com-api-runtime-mock = { path = "com-api-runtime-mock"}
com-api-runtime-lola = { path = "com-api-runtime-lola"}
com-api-gen = { path = "examples/com-api-gen"}
